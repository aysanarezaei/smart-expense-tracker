<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Smart Expense Tracker</h1>
            <p class="subtitle">Manage your money smarter.</p>
        </header>

        <section class="card">
            <p>Total Balance</p>
            <h2 class="balance">€ 1,050.00</h2>
        </section>

        <section class="summary">

            <div class="card">
                <p>Total Income</p>
                <h2>€ 1,500.00</h2>
            </div>

            <div class="card">
                <p>Total Expenses</p>
                <h2>€ 450.00</h2>
            </div>

        </section>

        <section class="card">
            <h2>Recent Transactions</h2>
            <p>No transactions yet.</p>
        </section>

    </div>

</body>
</html>
